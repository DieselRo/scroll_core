[package]
name = "scroll_core"
version = "0.2.0"
edition = "2021"
default-run = "scroll_core"
license = "MIT"

[dependencies]
anyhow = "1"
clap   = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { workspace = true }
console = "0.15"
rustyline = "16"
home = "0.5"
is-terminal = "0.4"
walkdir = "2"
pathdiff = "0.2"
sha2 = "0.10"

metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true, default-features = false, features = ["http-listener"] }

dotenvy = "0.15"

# ADK dependencies
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
bytes = "1.5"
## Removed legacy sqlx in favor of SeaORM-only path

sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json"
] }
migration = { path = "../migration" }

tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
crossbeam = "0.8"
ctrlc = "3"
once_cell = "1.19"

[lib]
name = "scroll_core"
path = "src/lib.rs"

[[bin]]
name = "test_db"
path = "src/bin/test_db.rs"

[[bin]]
name = "run_tests"
path = "src/bin/run_tests.rs"

[dev-dependencies]
logtest = "2"
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
wiremock = "0.6"
quickcheck = "1"

tempfile = "3"
assert_cmd = "2"
predicates = "3"
strip-ansi-escapes = "0.2"
trycmd = "0.15"


[features]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
cargo-deny = []
compact_tracing = []


[package.metadata.cargo-udeps.ignore]
normal = []
development = ["strip-ansi-escapes", "trycmd"]



